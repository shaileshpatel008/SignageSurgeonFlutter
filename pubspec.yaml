name: signage_surgeon
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.0
  cloud_firestore: ^5.4.0
  firebase_storage: ^12.3.0
  firebase_messaging: ^15.1.0

  # State Management
  flutter_bloc: ^8.1.5
  equatable: ^2.0.5

  # Navigation
  go_router: ^14.2.0

  # UI
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  pinput: ^5.0.0

  # Utils
  intl: ^0.19.0
  permission_handler: ^11.3.1
  shared_preferences: ^2.3.0
  uuid: ^4.4.0

  # Media
  image_picker: ^1.1.2
  video_player: ^2.9.2
  flutter_image_compress: ^2.3.0
  video_compress: ^3.1.3

  # Maps / Location
  google_maps_flutter: ^2.9.0
  google_places_flutter: ^2.0.9
  geolocator: ^13.0.1

  # Network / Payments
  http: ^1.2.2
  razorpay_flutter: ^1.3.7

  # PDF
  pdf: ^3.10.8
  printing: ^5.12.0

  # Other
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # Tools
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.3

# Flutter configuration
flutter:
  uses-material-design: true

  assets:
    - assets/images/

# Launcher icon configuration
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo.png"
  min_sdk_android: 21

# Native splash screen configuration
flutter_native_splash:
  color: "#FAF9F6"
  image: "assets/images/logo.png"

  android_12:
    color: "#FAF9F6"
    image: "assets/images/logo.png"